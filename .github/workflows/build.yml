name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      - uses: android-actions/setup-android@v3
      - name: Install SDK / NDK
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;28.2.13676358"
      - name: Build signed release APK
        run: |
          chmod +x ./gradlew
          ./gradlew :app:assembleRelease -PversionCode=${{ github.run_number }} --no-daemon --stacktrace
      - name: Pick universal APK
        run: |
          ls -R app/build/outputs/apk/release
          APK=$(find app/build/outputs/apk/release -name "*universal*.apk" | head -n 1)
          cp "$APK" MemEdit.apk
      - uses: actions/upload-artifact@v4
        with:
          name: MemEdit-apk
          path: MemEdit.apk
      - name: Publish release (direct APK download)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: "第 ${{ github.run_number }} 版"
          files: MemEdit.apk
          make_latest: true
